<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
  <script src="main.js" defer></script>
  <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            min-height: 100px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
  </style>
</head>
<body>
   <h1>Стилізація тексту</h1>
    <form id="textForm">
        <textarea id="textInput" rows="5" style="width: 100%; padding: 10px;"></textarea>
        <div class="controls">
            <label>
                Колір:
                <input type="color" id="colorPicker" value="#000000">
            </label>
            <label>
                Розмір:
                <input type="range" id="sizeSlider" min="10" max="40" value="16">
                <span id="sizeValue">16px</span>
            </label>
            <label>
                <input type="checkbox" id="boldCheckbox"> Жирний
            </label>
            <label>
                <input type="checkbox" id="italicCheckbox"> Курсив
            </label>
        </div>
        <button type="submit">Застосувати стилі</button>
    </form>
    <h2>Результат:</h2>
    <div id="output"></div>
</body>
</html>
