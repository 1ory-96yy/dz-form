<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
  <script src="main.js" defer></script>
  <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        form {
            display: grid;
            gap: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #orderSummary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            display: none;
        }
  </style>
</head>
<body>
   <h1>Книжковий магазин</h1>
    <form id="orderForm">
        <label>
            Оберіть книгу:
            <select id="bookSelect" required>
                <option value="" disabled selected>Оберіть книгу</option>
                <option value="Гаррі Поттер">Гаррі Поттер</option>
                <option value="Володар перснів">Володар перснів</option>
                <option value="1984">1984</option>
            </select>
        </label>
        <label>
            Кількість:
            <input type="number" id="quantity" min="1" value="1" required>
        </label>
        <label>
            Ваше ім'я:
            <input type="text" id="customerName" required>
        </label>
        <label>
            Дата доставки:
            <input type="date" id="deliveryDate" required>
        </label>
        <label>
            Адреса доставки:
            <input type="text" id="address" required>
        </label>
        <label>
            Коментар:
            <textarea id="comment" rows="3"></textarea>
        </label>
        <button type="submit">Замовити</button>
    </form>
    <div id="orderSummary"></div>
</body>
</html>
